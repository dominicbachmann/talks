name: Deploy talks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build decks
        run: |
          set -euo pipefail

          # dir under talks/ that holds the deck  ->  url segment under /talks/
          decks=(
            "2026-new-in-js-css:2026-new-in-js-css"
            "2026-signal-forms:2026-signal-forms"
            "2026-angular-typed-router/slides:2026-angular-typed-router"
            "2026-hashbrown/slides:2026-hashbrown"
          )

          out="$GITHUB_WORKSPACE/_site"
          mkdir -p "$out"
          cp site/index.html "$out/index.html"

          for entry in "${decks[@]}"; do
            dir="talks/${entry%%:*}"
            name="${entry##*:}"
            echo "::group::Building $name ($dir)"
            (
              cd "$dir"
              npm ci
              # Build slides only with the GitHub Pages subpath as base.
              # Skip the package build script so Angular demos aren't built.
              npx vite build --base="/talks/$name/" --outDir "$out/$name" --emptyOutDir
            )
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
