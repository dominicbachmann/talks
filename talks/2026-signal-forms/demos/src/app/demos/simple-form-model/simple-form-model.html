<div class="card">
  <h2>Login</h2>
  <div class="field">
    <label>Email</label>
    <input type="email" [formField]="loginForm.email" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" [formField]="loginForm.password" />
  </div>
  <div class="model-output">
    <pre>{{ loginModel() | json }}</pre>
  </div>
</div>
