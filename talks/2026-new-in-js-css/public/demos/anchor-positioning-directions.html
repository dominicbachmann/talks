<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif;
      padding: 24px; display: flex; flex-direction: column; gap: 16px; height: 100vh;
    }
    h3 { font-size: 14px; color: #8b949e; font-weight: 500; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button {
      padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d;
      background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
    }
    .controls button:hover { background: #30363d; }
    .controls button.active {
      border-color: #58a6ff; background: #1f3a5f; color: #58a6ff;
    }

    .demo-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      border: 1px solid #30363d; border-radius: 6px;
      background: #161b22; position: relative; overflow: clip;
    }

    .anchor-card {
      padding: 24px 40px; border-radius: 8px; background: #21262d;
      border: 1px solid #30363d; text-align: center;
      anchor-name: --card;
      position: relative;
    }
    .anchor-card .icon { font-size: 28px; margin-bottom: 6px; }
    .anchor-card .label { font-weight: 600; font-size: 16px; }
    .anchor-card .sub { color: #8b949e; font-size: 13px; margin-top: 4px; }

    .tip {
      position: absolute;
      position-anchor: --card;
      padding: 8px 14px; border-radius: 6px; background: #30363d;
      color: #e6edf3; font-size: 13px; white-space: nowrap;
      border: 1px solid #484f58;
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    .tip.visible { opacity: 1; }

    .tip-above {
      bottom: anchor(top); left: anchor(center);
      translate: -50% -10px;
    }
    .tip-below {
      top: anchor(bottom); left: anchor(center);
      translate: -50% 10px;
    }
    .tip-left {
      right: anchor(left); top: anchor(center);
      translate: -10px -50%;
    }
    .tip-right {
      left: anchor(right); top: anchor(center);
      translate: 10px -50%;
    }

    .badge {
      position: absolute;
      position-anchor: --card;
      bottom: anchor(top); left: anchor(right);
      translate: -50% 50%;
      background: #f85149; color: #fff; font-size: 12px; font-weight: 700;
      padding: 2px 8px; border-radius: 99px;
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none;
    }
    .badge.visible { opacity: 1; }

    .info {
      text-align: center; font-size: 13px; color: #8b949e;
    }
  </style>
</head>
<body>
  <h3>Click a direction to show the tooltip — all positioned with <code>anchor()</code></h3>
  <div class="controls">
    <button data-dir="above">Above</button>
    <button data-dir="below">Below</button>
    <button data-dir="left">Left</button>
    <button data-dir="right">Right</button>
    <button data-dir="badge">Corner badge</button>
    <button data-dir="all">Show all</button>
  </div>
  <div class="demo-area">
    <div class="anchor-card">
      <div class="icon">📦</div>
      <div class="label">Anchor Element</div>
      <div class="sub">Click buttons above to position tooltips</div>
    </div>
    <div class="tip tip-above">Positioned above with <b>anchor(top)</b></div>
    <div class="tip tip-below">Positioned below with <b>anchor(bottom)</b></div>
    <div class="tip tip-left">Left via <b>anchor(left)</b></div>
    <div class="tip tip-right">Right via <b>anchor(right)</b></div>
    <div class="badge">3</div>
  </div>
  <p class="info">Same anchor, different <code>anchor()</code> edges — pure CSS</p>

  <script>
    const tips = document.querySelectorAll('.tip');
    const badge = document.querySelector('.badge');
    const buttons = document.querySelectorAll('.controls button');

    function showDir(dir) {
      tips.forEach(t => t.classList.remove('visible'));
      badge.classList.remove('visible');

      if (dir === 'all') {
        tips.forEach(t => t.classList.add('visible'));
        badge.classList.add('visible');
      } else if (dir === 'badge') {
        badge.classList.add('visible');
      } else {
        const tip = document.querySelector(`.tip-${dir}`);
        if (tip) tip.classList.add('visible');
      }

      buttons.forEach(b => b.classList.toggle('active', b.dataset.dir === dir));
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => showDir(btn.dataset.dir));
    });

    showDir('below');
  </script>
</body>
</html>
