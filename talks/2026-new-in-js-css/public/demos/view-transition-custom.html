<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif;
      padding: 24px; display: flex; gap: 24px; height: 100vh;
    }

    /* --- Controls panel --- */
    .panel {
      display: flex; flex-direction: column; gap: 12px; width: 200px;
      flex-shrink: 0;
    }
    .panel h3 { font-size: 14px; color: #8b949e; }
    .option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid #30363d; background: #161b22;
      font-size: 13px; color: #c9d1d9; transition: border-color 0.15s;
    }
    .option:hover { border-color: #58a6ff; }
    .option.active { border-color: #3fb950; background: #1a2e1a; }
    .option input { display: none; }

    /* --- Phone frame --- */
    .phone {
      flex: 1; max-width: 380px; border-radius: 24px;
      border: 3px solid #30363d; background: #000;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .status-bar {
      height: 28px; background: #161b22; display: flex;
      align-items: center; justify-content: center;
      font-size: 11px; color: #484f58;
    }
    .phone-content {
      flex: 1; background: #0d1117; overflow: hidden;
      view-transition-name: app;
      contain: paint;
    }

    /* Suppress root transition so only the phone content animates */
    ::view-transition-old(root),
    ::view-transition-new(root) { animation: none; }
    ::view-transition-old(root) { display: none; }

    /* Clip animations to the phone screen area */
    ::view-transition-group(app) { overflow: clip; }

    /* --- App list view --- */
    .app-list { list-style: none; }
    .app-list li {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid #21262d;
      cursor: pointer;
    }
    .app-list li:hover { background: #161b22; }
    .app-list .icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .app-list .info { flex: 1; min-width: 0; }
    .app-list .title { font-size: 14px; font-weight: 600; }
    .app-list .subtitle { font-size: 12px; color: #8b949e; }
    .app-list .chevron { color: #484f58; font-size: 14px; }

    /* --- App detail view --- */
    .app-detail { padding: 16px; }
    .back-btn {
      background: none; border: none; color: #58a6ff;
      font-size: 14px; cursor: pointer; padding: 4px 0; margin-bottom: 16px;
    }
    .back-btn:hover { text-decoration: underline; }
    .detail-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    }
    .detail-header .icon {
      width: 56px; height: 56px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .detail-header h2 { font-size: 18px; }
    .detail-header .category { font-size: 12px; color: #8b949e; }
    .detail-body { font-size: 13px; color: #8b949e; line-height: 1.7; }
    .detail-body p { margin-bottom: 12px; }

    /* --- View transition animations --- */
    /* Slide (iOS-style) */
    @keyframes slide-to-left {
      to { transform: translateX(-30%); opacity: 0.6; }
    }
    @keyframes slide-from-right {
      from { transform: translateX(100%); }
    }
    @keyframes slide-from-left {
      from { transform: translateX(-30%); opacity: 0.6; }
    }
    @keyframes slide-to-right {
      to { transform: translateX(100%); }
    }

    /* Zoom */
    @keyframes zoom-out {
      to { transform: scale(0.9); opacity: 0; }
    }
    @keyframes zoom-in {
      from { transform: scale(1.1); opacity: 0; }
    }

    /* Flip */
    @keyframes flip-out {
      to { transform: perspective(600px) rotateY(-90deg); opacity: 0; }
    }
    @keyframes flip-in {
      from { transform: perspective(600px) rotateY(90deg); opacity: 0; }
    }

    /* Vertical slide (Android-style) */
    @keyframes slide-up-out {
      to { transform: translateY(-20%); opacity: 0; }
    }
    @keyframes slide-up-in {
      from { transform: translateY(60%); opacity: 0; }
    }
    @keyframes slide-down-out {
      to { transform: translateY(60%); opacity: 0; }
    }
    @keyframes slide-down-in {
      from { transform: translateY(-20%); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h3>Animation style</h3>
    <label class="option active" data-style="crossfade">
      <input type="radio" name="style" value="crossfade" checked>
      Default crossfade
    </label>
    <label class="option" data-style="slide">
      <input type="radio" name="style" value="slide">
      Slide
    </label>
    <label class="option" data-style="vertical">
      <input type="radio" name="style" value="vertical">
      Vertical
    </label>
    <label class="option" data-style="zoom">
      <input type="radio" name="style" value="zoom">
      Zoom
    </label>
    <label class="option" data-style="flip">
      <input type="radio" name="style" value="flip">
      3D Flip
    </label>
    <label class="option" data-style="none">
      <input type="radio" name="style" value="none">
      No transition
    </label>
  </div>

  <div class="phone">
    <div class="status-bar">demo app</div>
    <div class="phone-content" id="content"></div>
  </div>

  <script>
    const apps = [
      { icon: '📧', bg: '#1a3a5c', title: 'Messages', cat: 'Communication', desc: 'End-to-end encrypted messaging with support for rich media, reactions, and threaded conversations. Syncs across all your devices in real time.' },
      { icon: '📸', bg: '#3a1a4c', title: 'Photos', cat: 'Media', desc: 'Smart photo library that automatically organizes your memories by date, location, and people. Includes powerful editing tools and cloud backup.' },
      { icon: '🎵', bg: '#1a3a2c', title: 'Music', cat: 'Entertainment', desc: 'Stream millions of songs with personalized playlists, offline downloads, and lossless audio quality. Discover new artists every week.' },
      { icon: '📍', bg: '#4c3a1a', title: 'Maps', cat: 'Navigation', desc: 'Turn-by-turn navigation with real-time traffic, public transit routes, and offline maps. Explore nearby restaurants and points of interest.' },
      { icon: '⚙️', bg: '#2a2a3a', title: 'Settings', cat: 'System', desc: 'Customize your device with display options, notification preferences, privacy controls, and accessibility features.' },
      { icon: '📅', bg: '#1a4a3a', title: 'Calendar', cat: 'Productivity', desc: 'Schedule meetings, set reminders, and share calendars with your team. Integrates with email for automatic event detection.' },
      { icon: '🔐', bg: '#4a1a2a', title: 'Security', cat: 'System', desc: 'Manage passwords, biometric authentication, and two-factor security. Monitor login activity and get alerts for suspicious access.' },
    ];

    let currentStyle = 'crossfade';
    let isForward = true;

    // Dynamic stylesheet for view transition overrides
    const dynamicStyle = document.createElement('style');
    document.head.appendChild(dynamicStyle);

    function updateTransitionCSS() {
      const rules = {
        crossfade: `
          ::view-transition-old(app) { animation: 0.25s ease both fade-out; }
          ::view-transition-new(app) { animation: 0.25s ease both fade-in; }
          @keyframes fade-out { to { opacity: 0; } }
          @keyframes fade-in { from { opacity: 0; } }
        `,
        slide: isForward ? `
          ::view-transition-old(app) { animation: 0.3s ease both slide-to-left; z-index: 0; }
          ::view-transition-new(app) { animation: 0.3s ease both slide-from-right; z-index: 1; }
        ` : `
          ::view-transition-old(app) { animation: 0.3s ease both slide-to-right; z-index: 1; }
          ::view-transition-new(app) { animation: 0.3s ease both slide-from-left; z-index: 0; }
        `,
        vertical: isForward ? `
          ::view-transition-old(app) { animation: 0.3s ease both slide-up-out; }
          ::view-transition-new(app) { animation: 0.3s ease both slide-up-in; }
        ` : `
          ::view-transition-old(app) { animation: 0.3s ease both slide-down-in; }
          ::view-transition-new(app) { animation: 0.3s ease both slide-down-out; }
        `,
        zoom: `
          ::view-transition-old(app) { animation: 0.3s ease both zoom-out; }
          ::view-transition-new(app) { animation: 0.3s ease both zoom-in; }
        `,
        flip: `
          ::view-transition-old(app) { animation: 0.4s ease both flip-out; }
          ::view-transition-new(app) { animation: 0.4s ease both flip-in; }
        `,
      };
      dynamicStyle.textContent = rules[currentStyle] || '';
    }

    function renderList() {
      const el = document.getElementById('content');
      el.innerHTML = '<ul class="app-list">' + apps.map((a, i) =>
        `<li data-index="${i}">
          <div class="icon" style="background:${a.bg}">${a.icon}</div>
          <div class="info">
            <div class="title">${a.title}</div>
            <div class="subtitle">${a.cat}</div>
          </div>
          <span class="chevron">›</span>
        </li>`
      ).join('') + '</ul>';

      el.querySelectorAll('li[data-index]').forEach(li => {
        li.addEventListener('click', () => {
          isForward = true;
          updateTransitionCSS();
          const idx = parseInt(li.dataset.index);
          navigate(() => renderDetail(idx));
        });
      });
    }

    function renderDetail(idx) {
      const a = apps[idx];
      document.getElementById('content').innerHTML =
        `<div class="app-detail">
          <button class="back-btn" id="back">‹ Back</button>
          <div class="detail-header">
            <div class="icon" style="background:${a.bg}">${a.icon}</div>
            <div>
              <h2>${a.title}</h2>
              <span class="category">${a.cat}</span>
            </div>
          </div>
          <div class="detail-body">
            <p>${a.desc}</p>
            <p style="color:#484f58;font-style:italic">This is a demo detail view showing how custom CSS animations on view-transition pseudo-elements create different navigation feels.</p>
          </div>
        </div>`;

      document.getElementById('back').addEventListener('click', () => {
        isForward = false;
        updateTransitionCSS();
        navigate(renderList);
      });
    }

    function navigate(renderFn) {
      if (currentStyle !== 'none' && document.startViewTransition) {
        document.startViewTransition(() => renderFn());
      } else {
        renderFn();
      }
    }

    // Radio button handling
    document.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        currentStyle = opt.dataset.style;
        updateTransitionCSS();
      });
    });

    renderList();
  </script>
</body>
</html>
