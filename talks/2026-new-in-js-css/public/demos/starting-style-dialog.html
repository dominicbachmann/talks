<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif;
      padding: 24px; display: flex; flex-direction: column; gap: 16px; height: 100vh;
    }
    h3 {
      font-size: 14px; color: #8b949e; font-weight: 500;
    }
    .demo-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      border: 1px solid #30363d; border-radius: 6px;
      background: #161b22; position: relative;
    }

    .trigger {
      padding: 12px 24px; border-radius: 6px; border: 1px solid #3fb950;
      background: #238636; color: #fff; font-size: 15px; cursor: pointer;
    }
    .trigger:hover { background: #2ea043; }

    dialog {
      padding: 0; border: 1px solid #30363d; border-radius: 12px;
      background: #21262d; color: #c9d1d9;
      max-width: 400px; width: 90%;

      /* Final (visible) state */
      opacity: 1;
      transform: translateY(0);

      transition: opacity 0.35s ease,
                  transform 0.35s ease,
                  display 0.35s ease allow-discrete,
                  overlay 0.35s ease allow-discrete;
    }

    dialog[open] {
      opacity: 1;
      transform: translateY(0);
    }

    /* Entry animation */
    @starting-style {
      dialog[open] {
        opacity: 0;
        transform: translateY(-30px);
      }
    }

    /* Exit animation */
    dialog:not([open]) {
      opacity: 0;
      transform: translateY(-30px);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
      opacity: 1;
      transition: opacity 0.35s ease, display 0.35s ease allow-discrete;
    }

    @starting-style {
      dialog[open]::backdrop {
        opacity: 0;
      }
    }

    dialog:not([open])::backdrop {
      opacity: 0;
    }

    .dialog-header {
      padding: 16px 20px; border-bottom: 1px solid #30363d;
      font-size: 17px; font-weight: 600; color: #f0f6fc;
    }

    .dialog-body {
      padding: 16px 20px; font-size: 14px; line-height: 1.5;
    }

    .dialog-footer {
      padding: 12px 20px; border-top: 1px solid #30363d;
      display: flex; gap: 8px; justify-content: flex-end;
    }

    .btn-cancel {
      padding: 8px 16px; border-radius: 6px; border: 1px solid #30363d;
      background: #21262d; color: #c9d1d9; font-size: 14px; cursor: pointer;
    }
    .btn-cancel:hover { background: #30363d; }

    .btn-confirm {
      padding: 8px 16px; border-radius: 6px; border: 1px solid #3fb950;
      background: #238636; color: #fff; font-size: 14px; cursor: pointer;
    }
    .btn-confirm:hover { background: #2ea043; }

    .info {
      text-align: center; font-size: 13px; color: #8b949e;
    }
    .info code {
      background: #21262d; padding: 2px 6px; border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>Click the button — dialog slides down from above with a fade</h3>
  <div class="demo-area">
    <button class="trigger" onclick="document.getElementById('my-dialog').showModal()">
      Delete item
    </button>
    <dialog id="my-dialog">
      <div class="dialog-header">Confirm deletion</div>
      <div class="dialog-body">
        Are you sure you want to delete this item? This action cannot be undone.
      </div>
      <form method="dialog" class="dialog-footer">
        <button class="btn-cancel" value="cancel">Cancel</button>
        <button class="btn-confirm" value="confirm">Delete</button>
      </form>
    </dialog>
  </div>
  <p class="info">
    <code>@starting-style</code> on <code>dialog[open]</code> — the dialog slides down
    on open and fades up on close. Uses <code>&lt;form method="dialog"&gt;</code> for the buttons.
  </p>
</body>
</html>
