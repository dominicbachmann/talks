<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif;
      padding: 24px; display: flex; flex-direction: column; gap: 16px; height: 100vh;
    }
    h3 {
      font-size: 14px; color: #8b949e; font-weight: 500;
    }
    .demo-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
      border: 1px solid #30363d; border-radius: 6px;
      background: #161b22; position: relative;
    }

    .trigger {
      padding: 12px 24px; border-radius: 6px; border: 1px solid #f85149;
      background: #da3633; color: #fff; font-size: 15px; cursor: pointer;
    }
    .trigger:hover { background: #b62324; }

    dialog {
      margin: auto;
      border: 1px solid #30363d; border-radius: 10px;
      background: #21262d; color: #c9d1d9;
      padding: 28px 32px; max-width: 400px; text-align: center;
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    dialog h2 {
      font-size: 20px; margin-bottom: 8px; color: #f0f6fc;
    }
    dialog p {
      font-size: 15px; color: #8b949e; margin-bottom: 20px;
    }
    dialog form {
      display: flex; gap: 12px; justify-content: center;
    }
    dialog button {
      padding: 10px 24px; border-radius: 6px; font-size: 15px; cursor: pointer;
    }
    dialog button:focus-visible {
      outline: 2px solid #58a6ff; outline-offset: 2px;
    }
    .btn-cancel {
      border: 1px solid #30363d; background: #21262d; color: #c9d1d9;
    }
    .btn-cancel:hover { background: #30363d; }
    .btn-confirm {
      border: 1px solid #f85149; background: #da3633; color: #fff;
    }
    .btn-confirm:hover { background: #b62324; }

    .log {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 13px; font-family: ui-monospace, monospace;
      padding: 12px 16px; border-radius: 6px;
      background: #161b22; border: 1px solid #30363d;
      max-height: 80px; overflow-y: auto; width: 100%;
    }
    .log-entry { color: #8b949e; }
    .log-entry .value { color: #3fb950; }
    .log-entry .escape { color: #d29922; }

    .info {
      text-align: center; font-size: 13px; color: #8b949e;
    }
    .info code {
      background: #21262d; padding: 2px 6px; border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>Open the confirmation dialog and try both buttons, then try pressing Escape</h3>
  <div class="demo-area">
    <button class="trigger" id="delete-btn">Delete item</button>
    <dialog id="confirm">
      <h2>Delete this item?</h2>
      <p>This action cannot be undone.</p>
      <form method="dialog">
        <button value="cancel" class="btn-cancel">Cancel</button>
        <button value="confirm" class="btn-confirm">Delete</button>
      </form>
    </dialog>
  </div>
  <div class="log" id="log"></div>
  <p class="info">
    <code>&lt;form method="dialog"&gt;</code> closes the dialog on submit.
    The clicked button's <code>value</code> becomes <code>dialog.returnValue</code>.
  </p>
  <script>
    const dialog = document.getElementById('confirm');
    const log = document.getElementById('log');
    let count = 0;

    document.getElementById('delete-btn').addEventListener('click', () => {
      dialog.showModal();
    });

    dialog.addEventListener('close', () => {
      count++;
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const rv = dialog.returnValue;
      if (rv) {
        entry.innerHTML = `${count}. close event — returnValue: <span class="value">"${rv}"</span>`;
      } else {
        entry.innerHTML = `${count}. close event — returnValue: <span class="escape">""</span> <span style="color:#8b949e">(Escape pressed)</span>`;
      }
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
      dialog.returnValue = '';
    });
  </script>
</body>
</html>
